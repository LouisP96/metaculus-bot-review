[tool.poetry]
name = "metaculus-bot-review"
version = "0.1.0"
description = "Review how a Metaculus forecasting bot performed on the questions it forecast"
authors = ["Louis Prosser"]
readme = "README.md"
license = "MIT"
packages = [{ include = "metaculus_bot_review" }]
homepage = "https://github.com/LouisP96/metaculus-bot-review"
repository = "https://github.com/LouisP96/metaculus-bot-review"
keywords = ["metaculus", "forecasting", "bot", "review"]

[tool.poetry.dependencies]
python = "^3.11"
forecasting-tools = ">=0.2.92,<0.3.0"
pydantic = "^2.0"
python-dotenv = "^1.0"
requests = "^2.31"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.poetry.scripts]
bot-review = "metaculus_bot_review.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
